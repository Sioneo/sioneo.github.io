<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>UUID Generator</title>
  <style>
    body {
      color: white;
      background-color: black;
      font-family: Menlo, monospace, Courier, sans-serif;
    }


    button {
      background-color: black;
      border: solid 1px white;
      color: white;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 15px;
      font-family: Menlo, monospace, Courier, sans-serif;
    }

    button:active {
      color: black;
      background-color: white;
    }

    #result {
      font-weight: normal;
    }
  </style>
</head>

<body>
  <center>
    <h2>UUID Generator</h2>
    <h3 id="result"><br></h3>
    <button onclick="document.getElementById('result').innerHTML = crypto.randomUUID()">Generate</button>
    <button onclick="navigator.clipboard.writeText(document.getElementById('result').innerHTML)">Copy</button>
  </center>
</body>

</html>
