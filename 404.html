<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>(ﾟДﾟ≡ﾟдﾟ)!?</title>
  <style>
    body {
      font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
    }

    hr {
      background: var(--hrColor, #b3b3b3);
      border: 0;
      height: 1px;
      padding: 0px;

<body>

    <p style="font-size: 70px; color: #009ca7">404</p>

    <p id="url"></p>
    <p>Page Not Found - 页面不存在丨这可能是因为URL输入错误或页面尚未准备好</p>
    <script>
      var currentURL = window.location.href;
      document.getElementById("url").innerHTML = currentURL;
    </script>
  </div>
</body>

</html>
