<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="../../css/document.min.css">
  <title>插件制作工具-插件清单</title>
  <script src="/web/service/web-service.js"></script>
  <script src="/web/footer/theotown-footer.js"></script>
  <script src="./manifest-js/manifest.js" type="module" defer></script>
  <script src="./modules/module-manifest.js" type="module" defer></script>
  <script src="/web/service/modules/form.js" type="module" defer></script>
  <script src="/web/service/js-zip.js"></script>
  <script src="./manifest-js/injector.js" defer></script>
</head>

<body>
  <header>
    <a href="index.html">
      <i class="w">5</i>
    </a>
    <h4 class="header-title">插件制作工具-插件清单</h4>
    <nav>
      <a href="/theotown/guide/plugin-manifest.html">了解插件清单文件</a>
    </nav>
  </header>
  <main>
    <section class="spoiler">
      <div class="spoiler-header">
        <button class="active" id="manifest-form-spoiler-button"><i class="b">k</i></button>
        <h5 class="spoiler-header">清单数据</h5>
      </div>
      <div class="active spoiler-content" id="manifest-form-spoiler-content">
        <p>带<em>*</em>的为必填项</p>
        <div id="form-mountpoint"></div>
      </div>
    </section>
    <section class="spoiler">
      <div class="spoiler-header">
        <button class="active" id="manifest-result-spoiler-button"><i class="b">k</i></button>
        <h5 class="spoiler-title">JSON</h5>
        <button class="button-big" id="generate-button">生成清单</button>
        <button class="button-big"
          onclick="navigator.clipboard.writeText(
            document.getElementById('json-output').textContent
            );">
        复制</button>
      </div>
      <div class="spoiler-content active" id="manifest-result-spoiler-content">
        <pre id="json-output"></pre>
      </div>
    </section>
    <section class="spoiler">
      <div class="spoiler-header">
        <button class="active" id="manifest-injection-spoiler-button"><i class="b">k</i></button>
        <h5>注入到插件中</h5>
      </div>
      <div id="manifest-injection-spoiler-content" class="active spoiler-content">
        <p>你可以在此上传插件的压缩包 (.zip 格式)，程序会帮你将插件清单文件自动注入到压缩包中</p>
        <form>
          <div class="line">
            <label for="plugin-input">上传文件</label>
            <input id="plugin-input" type="file" accept="application/zip">
            <button type="button" class="button-small" id="plugin-injection-button">OK</button>
          </div>
        </form>
      </div>
    </section>
  </main>
  <theotown-footer></theotown-footer>
  <script>
    Web.addSpoiler("manifest-form-spoiler-button", "manifest-form-spoiler-content");
    Web.addSpoiler("manifest-result-spoiler-button", "manifest-result-spoiler-content");
    Web.addSpoiler("manifest-injection-spoiler-button", "manifest-injection-spoiler-content");
  </script>
</body>

</html>
