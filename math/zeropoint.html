<!DOCTYPE html>
<html>
<head>
    <!-- 基本元信息和页面标题 -->
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="../generalstyle.css">
    <title>函数零点计算器</title>
    
    <!-- 内联CSS样式 -->
    <style>
        .math {
            font-family: serif;
            font-style: italic;
        }
        .inputBox button {
            width: 2em;
            height: 2em;
            font-size: 20px;
        }
  
        #keys button {
           font-family: Nove, Ark, sans-serif;
        }
    </style>

    <script>
        var debug = false;
    </script>
</head>
<body>
    <!-- JavaScript未启用的警告提示 -->
    <p id="jswarning" style="background-color: red; color: white; width: 100%; text-align: left;">[!]JavaScript未启用</p>

    <!-- 主计算器界面 -->
    <div class="main">
        <h1>函数零点计算器</h1>
        <hr>
        <p>在此输入要计算的函数解析式：（请先阅读<b><a href="tutorial.html" target="_blank"><u>输入方法</u></a></b>）</p>
        <p>若结果范围较大，可尝试提高精度或调整区间(a&b)</p>
        <h4>请勿省略乘号</h4>
        
        <!-- 函数输入区域 -->
        <div style="display: flex" class="box">
            <p><b>f(x)&nbsp;=</b></p>&emsp;
            <p style="font-size: 120%; width: 100%; font-family: serif, Ark, sans-serif" id="mainInput"></p>
            <button style="white-space: pre" onClick="document.getElementById('mainInput').innerHTML = '(' + document.getElementById('mainInput').innerHTML; realInput.innerHTML = '(' + realInput.innerHTML;">(<-</button>
            <button style="background-color: red; color: white;" onClick="document.getElementById('realInputContent').innerHTML = ''; document.getElementById('mainInput').innerHTML = '';"><b>AC</b></button>
            <button style="white-space: pre" onClick="input = document.getElementById('mainInput'); inputTargetDisplay.innerHTML = 'main'">切换</button>
        </div>

        <!-- 计算器按钮布局 -->
        <div style="width: 100%; display: flex;">
            <!-- 左侧功能按钮区 -->
            <div style="display: inline-block;" class="inputBox">
                <!-- 数学函数按钮 -->
                <div style="display: inline-block" class="box">
                    <button class="math" onClick="add('x')"><i>x</i></button>
                    <button onClick="add('(')">(</button>
                    <button onClick="add(')')">)</button>
                    <br><br>
                    <button onClick="add('x2')"><span class="math">x</span>²</button>
                    <button onClick="add('pi')">π</button>
                    <button class="math" onClick="add('e')">e</button>
                    <br><br>
                    <button onClick="add('x3')"><span class="math">x</span>³</button>
                    <button onClick="add('sqrt')">√</button>
                    <button onClick="add('^')">^</button>
                    <br><br>
                    <button onClick="add('log2')">㏒</button>
                    <button onClick="add('lg')">lg</button>
                    <button onClick="add('ln')">ln</button>
                </div>
                &emsp;
                <!-- 数字和运算符按钮 -->
                <div id="keys" style="display: inline-block" class="box">
                    <button onClick="add('9')">9</button>
                    <button onClick="add('8')">8</button>
                    <button onClick="add('7')">7</button>
                    <button onClick="add('×')"><b>×</b></button>
                    <br><br>
                    <button onClick="add('6')">6</button>
                    <button onClick="add('5')">5</button>
                    <button onClick="add('4')">4</button>
                    <button onClick="add('÷')"><b>÷</b></button>
                    <br><br>
                    <button onClick="add('3')">3</button>
                    <button onClick="add('2')">2</button>
                    <button onClick="add('1')">1</button>
                    <button onClick="add('+')"><b>+</b></button>
                    <br><br>
                    <button onClick="add('0')">0</button>
                    <button onClick="add('.')">.</button>
                    <button onClick="add('C')"><</button>
                    <button onClick="add('-')"><b>－</b></button>
                </div>
            </div>

            &emsp;
            <!-- 右侧参数输入区 -->
            <div style="flex: 1; display: column">
                <!-- 精度参数输入 -->
                <div style="display: flex; justify-content: space-between;" class="box">
                     <div style="display: flex;">
                        <p><b>ε</b></p>&emsp;
                        <p style="font-family: Nove, Ark, serif; flex: 1" id="epsilonInput"></p>
                     </div>
                    
                     <div style="display: flex">
                        <button onClick="document.getElementById('epsilonInput').innerHTML = document.getElementById('epsilonInput').innerHTML + '00'">00</a>
                        <button onClick="document.getElementById('epsilonInput').innerHTML = document.getElementById('epsilonInput').innerHTML + '000'">000</a>
                        <button onClick="document.getElementById('epsilonInput').innerHTML = document.getElementById('epsilonInput').innerHTML + '00000'">00000</a>                    
                        <button style="background-color: red; color: white;" onClick="document.getElementById('epsilonInput').innerHTML = '';"><b>AC</b></button>
                        <button onClick="input = document.getElementById('epsilonInput'); inputTargetDisplay.innerHTML = 'epsilon'">切换</button>
                     </div>
                    
                </div>
                <!-- 区间下限输入 -->
                <div style="display: flex;" class="box">
                    <p><b>a</b></p>&emsp;
                    <p style="font-family: Nove, Ark, serif; flex: 1" id="aInput"></p>
            <button style="background-color: red; color: white;" onClick="document.getElementById('aInput').innerHTML = '';"><b>AC</b></button>
                    <button onClick="input = document.getElementById('aInput'); inputTargetDisplay.innerHTML = 'a'">切换</a>
                </div>
                <!-- 区间上限输入 -->
                <div style="display: flex;" class="box">
                    <p><b>b</b></p>&emsp;
                    <p style="font-family: Nove, Ark, serif; flex: 1" id="bInput"></p>
            <button style="background-color: red; color: white;" onClick="document.getElementById('bInput').innerHTML = '';"><b>AC</b></button>
                    <button onClick="input = document.getElementById('bInput'); inputTargetDisplay.innerHTML = 'b'">切换</a>
                </div>

                <!-- 开始计算按钮 -->
                <button id="runButton" style="padding: 10px; width: 40%; background-color: rgba(30, 190, 30, 100); "><h2 style="color: white;">开始</h2></button>
            </div>
        </div>

        <hr>

        <!-- 结果展示区域 -->
        <div class="box">
            <h4>结果</h4>
            <p id="result" style="font-family: Nove, Ark, sans-serif; font-size: 130%; display: none"></p>
        </div>

    </div> <!-- main结束 -->
    <br>


<!-- 输入缓冲区，即realInputContent和fakeInputContent，realInputContent用于记录要如输入给JavaScript直接运行的函数，例如x²->x**2，而fakeInputCotent用于在输入对象不是main，即是精度epsilon，a，b的时候将JavaScript中的realContent转向其，以不影响realInputContent的内容 -->

    <!--调试功能区域 -->
    <div class="box">
        <div style="display: flex; justify-content: space-between;">
            <div style="display: flex">
                <p>Made by <a href="https://b23.tv/063fUnL" target="_blank">Sioneo</a></p>
            </div>
            <div style="display: flex;">
                <button onClick="if (debug != true){document.getElementById('debugBox').style.display = 'block'; debug = true}else{document.getElementById('debugBox').style.display = 'none'; debug = false}">Debug</button>
            </div>
        </div>

        <div id="debugBox" style="display: none" class="box">
            <span><b>Input Target: </b></span><span id="inputTarget"></span><br>
            <input id="directlyInput" type="text">
            <button onClick="const directlyInput = document.getElementById('directlyInput'); realInput.innerHTML = directlyInput.value; input.innerHTML='';">运行</button>

            <p id="realInputContent"></p>

            <br>
            <p><b>运行过程:</b></p>
            <p style="font-family: monospace;" id="process"></p>

        </div>
    </div>

    <!-- 隐藏的输入缓冲区 -->
    <p style="display: none;"id="fakeInputContent"></p>

    <!-- JavaScript代码 -->
    <script>
        // 初始化页面元素
        document.getElementById("jswarning").style.display = "none";
        const inputTargetDisplay = document.getElementById("inputTarget")
        let input = document.getElementById("mainInput")
        inputTargetDisplay.innerHTML = "main"
        var realInput = document.getElementById("realInputContent")

        // 添加字符到输入框的函数
        function add(v) {
            // 根据当前输入目标选择正确的输入缓冲区
            if (document.getElementById("inputTarget").innerHTML != "main"){
                realInput = document.getElementById("fakeInputContent")
            }
            else{
                realInput = document.getElementById("realInputContent")
            }
            
            // 处理不同类型的输入
            switch(v){
              case "C":  // 退格
                  switch(input.innerHTML.slice(-4)){
                      case "log₂":
                          input.innerHTML = input.innerHTML.slice(0, -3);
                          realInput.innerHTML = realInput.innerHTML.slice(0, -8);
                          break;
                  }
                  switch(input.innerHTML.slice(-2)){
                      case "lg":
                          input.innerHTML = input.innerHTML.slice(0, -1);
                          realInput.innerHTML = realInput.innerHTML.slice(0, -9);
                          break;                      
                      case "ln":
                          input.innerHTML = input.innerHTML.slice(0, -1);
                          realInput.innerHTML = realInput.innerHTML.slice(0, -7);
                          break;
                      default:
                          break;
                  }
                  switch(input.innerHTML.slice(-1)){
                      case "π":
                          input.innerHTML = input.innerHTML.slice(0, -1);
                          realInput.innerHTML = realInput.innerHTML.slice(0, -7);
                          break;
                      case "e":
                          input.innerHTML = input.innerHTML.slice(0, -1);
                          realInput.innerHTML = realInput.innerHTML.slice(0, -6);
                          break;
                      case "x":
                          input.innerHTML = input.innerHTML.slice(0, -1);
                          realInput.innerHTML = realInput.innerHTML.slice(0, -1);
                          break;
                      case "^":
                          input.innerHTML = input.innerHTML.slice(0, -1);
                          realInput.innerHTML = realInput.innerHTML.slice(0, -2);
                          break;
                      case "√":
                          input.innerHTML = input.innerHTML.slice(0, -1);
                          realInput.innerHTML = realInput.innerHTML.slice(0, -9);
                          break;
                      default:
                          input.innerHTML = input.innerHTML.slice(0, -1);
                          realInput.innerHTML = realInput.innerHTML.slice(0, -1);
                          break;
                  }
                  break;
              case "×":  // 乘法符号转换
                  input.innerHTML = input.innerHTML + "×";
                  realInput.innerHTML = realInput.innerHTML + "*";
                  break;
              case "÷":  // 除法符号转换
                  input.innerHTML = input.innerHTML + "÷";
                  realInput.innerHTML = realInput.innerHTML + "/";
                  break;
              case "pi":  // π常量
                  input.innerHTML = input.innerHTML + "π";
                  realInput.innerHTML = realInput.innerHTML + "Math.PI";
                  break;
              case "e":  // e常量
                  input.innerHTML = input.innerHTML + "e";
                  realInput.innerHTML = realInput.innerHTML + "Math.E";
                  break;
              case "^":  // 幂运算
                  input.innerHTML = input.innerHTML + "^";
                  realInput.innerHTML = realInput.innerHTML + "**";
                  break;
              case "x":  // 变量x
                  input.innerHTML = input.innerHTML + 'x';
                  realInput.innerHTML = realInput.innerHTML + "x";
                  break;
              case "x2":  // x平方
                  input.innerHTML = input.innerHTML + "x^2";
                  realInput.innerHTML = realInput.innerHTML + "x**2";
                  break;
              case "x3":  // x立方
                  input.innerHTML = input.innerHTML + "x^3";
                  realInput.innerHTML = realInput.innerHTML + "x**3";
                  break;
              case "sqrt":  // 平方根
                  input.innerHTML = input.innerHTML + "√";
                  realInput.innerHTML = realInput.innerHTML + "Math.sqrt";
                  break;
              case "log2":  // log2
                  input.innerHTML = input.innerHTML + "log₂";
                  realInput.innerHTML = realInput.innerHTML + "Math.log2";
                  break;
              case "lg":  // log10
                  input.innerHTML = input.innerHTML + "lg";
                  realInput.innerHTML = realInput.innerHTML + "Math.log10";
                  break;
              case "ln":  // ln
                  input.innerHTML = input.innerHTML + "ln";
                  realInput.innerHTML = realInput.innerHTML + "Math.log";
                  break;
              default:  // 其他字符直接添加
                  input.innerHTML = input.innerHTML + v;
                  realInput.innerHTML = realInput.innerHTML + v;
            }
        }

        document.getElementById("runButton").addEventListener("click", function(){
            const func = document.getElementById("realInputContent").innerHTML;
            const f = new Function("x", "return " + func);

            const epsilon = parseFloat(document.getElementById("epsilonInput").innerHTML);
            let a = parseFloat(document.getElementById("aInput").innerHTML);
            let b = parseFloat(document.getElementById("bInput").innerHTML);
            
            let result;
            let process = "";
            const maxLoop = 1000;
            let counter = 0;
 
            if (f(a)*f(b) >= 0) {
                result = "找不到零点";
            }
            else { 
                let fc0 = false;                   
                while(Math.abs(a-b) >= epsilon && counter <= maxLoop){
                    let c = (a+b) / 2;
                    process = process + "[(" + counter + ") a = " + a + " b = " + b + " c = " + c;
                    if (f(a)*f(c) < 0){
                        b = c;
                        process = process + " ,f(a)*f(c) < 0, b = c = " + c;
                    }
                    else{
                        if (f(c) > 0){
                            a = c;
                            process = process + " ,f(a)*f(c) >= 0, f(c) > 0, a = c = " + c;
                        }
                        else if (f(c) == 0){
                            a = c;
                            fc0 = true;
                            process = process + " ,f(a)*f(c) >= 0, f(c) == 0, a = c = " + c + "[BREAK]]";
                            break;
                        }
                        else{
                            a = c;
                            process = process + " ,f(a)*f(c) >= 0, f(c) < 0, a = c = " + c;
                        }
                    }
                    process = process + "] <br>";
                    counter++;
                }
                
                if (counter > maxLoop){
                    result = "while循环次数超限(1000次)";
                }
                else{
                  if (fc0 != true){
                    result = a + " ~ " + b;
                  }
                  else {
                    result = a;
                  }
                }
            }

            document.getElementById("process").innerHTML = process;
            document.getElementById("result").style.display = "block";
            document.getElementById("result").innerHTML = result;
        });
    </script>
</body>
</html>
