    <main>
        <h3>什么是草稿？</h3>
        <p>草稿（Draft）指的是游戏中的每一个元素，一个建筑是草稿，一个动画也是草稿，<b>对于插件制作来说</b>，所有有id的游戏元素都是草稿<br>
        例如，当你创建一个带有夜景的住宅插件时，你实际创建两个草稿：建筑和夜景动画<br>
        草稿这个名词在插件制作中经常被使用，理解这个有助于理解教程、说明等信息
        </p>
    
        <br><hr><p>参考资料：<a href="https://pca.svetikas.lt/docs/draft-types/">https://pca.svetikas.lt/docs/draft-types/</a></p>
