<!DOCTYPE html>
<html>
<head>
    <!-- 基本元信息和页面标题 -->
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="../generalstyle.css">
    <title>函数零点计算器-教程</title>

    <style>
        em {
            font-style: normal;
            background-color: #d4d4d4;
        }
    </style>
</head>
<body>

    <div class="main">
 
        <h1>输入方法</h1>
        <hr>

        <h3>不可以省略乘号</h3>
        <p>例如<em>2x</em>是不对的，应输入<em>2×x</em>
        <hr>

        <h3>使用括号</h3>
        <p>log, lg, ln, √在输入时应带有括号，例如ln10应输入<em>ln(10)</em>，根号3x应输入<em>√(3×x)</em></p>
        <p>在输入其他表达式时，也应该适当多地使用括号，以避免产生歧义。例如4+x的x+9+lg10次方应输入为<em>(4+x)^(x+9+lg(10))</em>

    </div> <!-- main结束 -->
</body>
</html>
