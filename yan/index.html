<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Aligned Content Tabs</title>
    <style>
        :root {
            --text-color: white;
            --text-secondary: #888;
            --bg-color: #121212;
            --active-color: white;
        }
        
        @font-face {
            font-family: "Ark";
            src: url("../font/bender.otf");
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: "Ark";
            src: url("../font/benderbold.otf");
            font-weight: bold;
            font-style: normal;
        }
        @font-face {
            font-family: "Nove";
            src: url("../font/novecentomedium.otf");
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: "Nove";
            src: url("../font/novecentobold.otf");
            font-weight: bold;
            font-style: normal;
        }
        
        body {
            color: var(--text-color);
            font-family: Nove, sans-serif;
            margin: 0;
            background: var(--bg-color);
            transition: color 1.5s ease, background-color 1.5s ease;
            overflow-x: hidden;
        }

        /* 添加背景图片层 */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('picture/arkbackground.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }

        p {
            color: var(--text-color);
            font-family: Ark, sans-serif;
            transition: color 1.5s ease;
        }
     
        strong {
            font-family: Nove, sans-serif;
        }

        a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 1.5s ease;
        }
        
        .master {
            position: relative;
            min-height: 100vh;
            padding: 1.5em;
            box-sizing: border-box;
            transition: background-color 1.5s ease;
        }
        
        .title {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1em;
            height: 30px;
            z-index: 1000;
            position: relative;
            background-color: transparent;
        }
        
        .index {
            display: flex;
            gap: 2.3em;
        }
        
        button {
            background-color: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: Nove, sans-serif;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: color 0.3s;
            position: relative;
            padding: 0.5em 0;
        }

       button, 
       button:active, 
       button:focus {
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        button.active {
            color: var(--active-color);
        }
        
        .content {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            position: relative;
            min-height: auto;
            pointer-events: none;
            margin-bottom: 20px;
        }
        
        .content.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        
        .content > * {
            opacity: 0;
            transform: translateX(30px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

       .no-animate, 
       .no-animate > * {
            opacity: 1 !important;
            transform: none !important;
            transition: none !important;
       }
       
       /* 修改后的视频容器样式 - 100%宽度且无白边 */
       .video-container {
            position: relative;
            width: 100%;
            margin: 20px 0;
            display: none;
            overflow: hidden;
       }
       
       .video-player {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover; /* 保持宽高比同时填满容器 */
       }
       
       /* 提示按钮样式 */
       .tap-to-continue {
            position: fixed;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-family: Nove, sans-serif;
            color: var(--text-color);
            text-align: center;
            opacity: 1;
            transition: color 1.5s ease, opacity 0.5s ease;
            pointer-events: auto;
            cursor: pointer;
            animation: blink 2s infinite;
            z-index: 999;
       }
       
       @keyframes blink {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
       }
       
       .white-bg {
            background-color: white !important;
            transition: background-color 1.5s ease !important;
       }
       
       .white-bg,
       .white-bg p,
       .white-bg a,
       .white-bg .content > *,
       .white-bg button.active {
            color: #121212 !important;
       }
       
       .hidden {
            display: none !important;
       }
       
       .footer {
            position: relative;
            text-align: right;
            padding: 10px 0;
            margin-top: 20px;
       }
       
       /* Latest content styles */
       #latestcontent {
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #121212;
            border-radius: 8px;
            margin-top: 20px;
            font-family: Ark, sans-serif;
            line-height: 1.6;
            display: none;
       }
       
       #latestcontent p {
            color: #121212;
            margin: 0 0 10px 0;
       }
    </style>
</head>
<body>
    <!-- 背景图片层 -->
    <div class="bg-overlay"></div>
    
    <div class="master">
        <div class="title">
            <div class="left-content">
                <img src="picture/yanlogo.PNG" style="margin: 16px 0 0 0;" alt="yanlogo" width=75 height=75>
            </div>
            <div class="index">
                <button class="tab-button active" data-tab="latest">最新</button>
                <!--<button class="tab-button" data-tab="about">ABOUT ME</button>-->
                <!--<button class="tab-button" data-tab="plugins">PLUGINS</button>-->
                <!--<button class="tab-button" data-tab="contact">CONTACT</button>-->
            </div>
        </div>
        
        <div id="latest" class="content active">
            <!-- 视频容器 - 将自动填充100%宽度 -->
            <div class="video-container">
                <video class="video-player" controlsList="nodownload">
                    <source src="video/midland.MP4" type="video/mp4">
                </video>
            </div>
            <div id="latestcontent">
            </div>
        </div>

        <div id="about" class="content">
            <h2>Who am I?</h2>
        </div>
        
        <div id="plugins" class="content">
            <h2>My Plugins</h2>
        </div>
        
        <div id="contact" class="content">
            <h2>Get In Touch</h2>
            <div class="contact-method">
                <p><strong>Email</strong>&emsp;lindotheotown@outlook.com</p>
                <p><strong>Forum</strong>&emsp;<a href="https://forum.theotown.com/memberlist.php?mode=viewprofile&u=227382">https://forum.theotown.com/memberlist.php?mode=viewprofile&u=227382</a></p>
            </div>
        </div>

    </div>
    
    <!-- 提示按钮 -->
    <div class="tap-to-continue">-TAP ANYWHERE TO CONTINUE-</div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.tab-button');
            const contents = document.querySelectorAll('.content');
            const tapToContinue = document.querySelector('.tap-to-continue');
            const master = document.querySelector('.master');
            const videoContainer = document.querySelector('.video-container');
            const videoPlayer = document.querySelector('.video-player');
            const latestcontent = document.getElementById('latestcontent');
            const bgOverlay = document.querySelector('.bg-overlay');
            
            // 初始化动画
            animateContent(document.querySelector('.content.active'));
            
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    buttons.forEach(btn => btn.classList.remove('active'));
                    contents.forEach(content => {
                        content.classList.remove('active');
                        resetAnimation(content);
                    });
                    
                    this.classList.add('active');
                    const tabId = this.getAttribute('data-tab');
                    const activeContent = document.getElementById(tabId);
                    activeContent.classList.add('active');
                    
                    animateContent(activeContent);
                });
            });
            
            // 点击继续按钮的处理
            tapToContinue.addEventListener('click', async function() {
                // 立即隐藏按钮
                this.classList.add('hidden');
                
                // 应用白色背景和黑色文字
                document.body.classList.add('white-bg');
                master.classList.add('white-bg');
                // 隐藏背景图片层
                bgOverlay.style.opacity = '0';
                
                try {
                    // 延迟1秒后播放视频
                    setTimeout(async () => {
                        try {
                            // 显示视频容器
                            videoContainer.style.display = 'block';
                            // 初始不显示控制条
                            videoPlayer.controls = false;
                            videoPlayer.muted = true;
                            await videoPlayer.play();
                            
                            // 显示最新内容
                            latestcontent.style.display = 'block';
                            // 为最新内容添加动画
                            setTimeout(() => {
                                latestcontent.style.opacity = '0';
                                latestcontent.style.transform = 'translateY(20px)';
                                latestcontent.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                                void latestcontent.offsetWidth; // 触发重绘
                                latestcontent.style.opacity = '1';
                                latestcontent.style.transform = 'translateY(0)';
                            }, 100);
                        } catch (error) {
                            console.error('视频播放失败:', error);
                        }
                    }, 1000);
                    
                } catch (error) {
                    console.error('视频加载失败:', error);
                }
                
                // 阻止视频控制
                videoPlayer.addEventListener('contextmenu', function(e) {
                    e.preventDefault();
                });
            });
            
            function resetAnimation(content) {
                const children = content.querySelectorAll('*:not(.no-animate):not(.no-animate *)');
                children.forEach(child => {
                    child.style.opacity = '0';
                    child.style.transform = 'translateX(30px)';
                    child.style.transitionDelay = '0s';
                });
            }

            function animateContent(content) {
                void content.offsetWidth;
                const children = content.querySelectorAll('*:not(.no-animate):not(.no-animate *)');
                children.forEach((child, index) => {
                    child.style.transitionDelay = `${index * 0.1}s`;
                    child.style.opacity = '1';
                    child.style.transform = 'translateX(0)';
                });
            }
        });
    </script>
</body>
</html>
